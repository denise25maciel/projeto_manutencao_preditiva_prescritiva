[project]
name = "manutencao-prescritiva"
version = "0.1.0"
description = "Manutencao prescritiva para maquinas rotativas: similaridade de eventos de vibracao + RAG sobre procedimentos"
requires-python = ">=3.11"

# Parte 0 roda so com estas. As demais entram nas partes seguintes.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "streamlit>=1.36",
    "altair>=5.3",
    "pyarrow>=15.0",
    "pypdf>=5.0",
    "sqlalchemy>=2.0",
    # Parte 5: mensagens tipadas e saida estruturada, iguais nos tres provedores.
    # O adaptador de cada um fica em `llm`, abaixo — instalar o core nao obriga
    # a instalar provedor nenhum.
    "langchain-core>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Parte 3 em diante
ml = ["scikit-learn>=1.5"]
# Parte 5 — os provedores. `ollama` e a meta da entrega; os outros sao para
# desenvolver. Nenhum e obrigatorio: sem cliente, a conversa devolve o texto
# cru do manual.
llm = ["langchain-openai>=1.0", "langchain-ollama>=1.0", "langchain-anthropic>=1.0"]
# Busca por significado nos documentos em portugues.
rag = ["sentence-transformers>=3.0"]
# Parte 6
api = ["fastapi>=0.111", "uvicorn>=0.30", "httpx>=0.27"]
# matplotlib so e usado pelos notebooks; o runtime e a UI nao dependem dele.
dev = ["pytest>=8.0", "jupyter>=1.0", "ruff>=0.5", "matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
