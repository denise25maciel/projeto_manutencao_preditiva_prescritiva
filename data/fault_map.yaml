# fault_map.yaml — mapa entre a coluna `fault` do banner.csv e os procedimentos
#
# ESTE ARQUIVO E VERSIONADO. E decisao, nao dado.
#
# Papel no sistema (principio 1 do GUIA.md): numero nunca e comparado com
# texto. O evento de sensor resolve para um rotulo, o rotulo resolve para uma
# familia via `aliases`, e a familia resolve para um documento via `documentos`.
# O guardrail G3 consulta `documentos` com um SELECT — nunca por similaridade
# semantica, que sempre retornaria algo.
#
# `is_problem: false` marca ESTADO, nao defeito. O guardrail G2 encerra o fluxo
# prescritivo antes do G3: nao ha acao corretiva para uma maquina normal.
#
# A primeira versao foi derivada do heuristico de `sugerir_familias` e revisada
# a mao contra os PDFs. A partir daqui e mantido a mao: os aliases sao a lista
# exaustiva dos 151 valores distintos observados, incluindo os erros de
# digitacao do operador, que precisam mapear para a familia correta.

